name: Frontend capture checks
on:
  push:
    branches: [frontend]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python web/scripts/check_scaler_contract.py
